<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">

        <title>Number match</title>
        <link rel="stylesheet" href="styles.css">
        
        <script src="../Scripts/element.js" defer></script>
        <script src="../Scripts/game.js" defer></script>
        <script src="../Scripts/script.js" defer></script>
        <script src="../Scripts/solver.js" defer></script>
        <script src="../Scripts/grid.js" defer></script>
        <script src="../Scripts/input.js" defer></script>
        <script src="../Scripts/check.js" defer></script>
        <script src="../Scripts/customization.js" defer></script>
        <script src="./Scripts/link.js" defer></script>
    </head>
    <body>
        <div id="menu">
            <div class="menu_line">
                <button id="apply">Appliquer</button>
                <button id="restore">Reset</button>
            </div>

            
            <div class="menu_line">
                <p>Fond</p>
                <input type="color" class="colorPicker" id="bck">
            </div>
            
            <div class="menu_line">
                <p>Bord</p>
                <input type="color" class="colorPicker" id="brd">
            </div>
            
            <div class="menu_line">
                <p>Nombre valide</p>
                <input type="color" class="colorPicker" id="valNum">
            </div>
            
            <div class="menu_line">
                <p>Nombre mort</p>
                <input type="color" class="colorPicker" id="deadNum">
            </div>
            
            <div class="menu_line">
                <p>Indice</p>
                <input type="color" class="colorPicker" id="clu">
            </div>
            
        </div>
        <div id="topBand">
            <div id = "back" class ="topElement imgContain">
                <img src="../Ressources/back.png" alt="back button" />
            </div>
            <div id ="opt" class ="topElement imgContain">
                <img src="../Ressources/opt.png" alt="option button" />
            </div>
            <div id ="score" class="topElement"></div>
            <div id = "stepSection" class ="topElement">
                <div class ="subTopElement">Step</div>
                <div id="step" class ="subTopElement"></div>
            </div>
            <div id ="highSection" class ="topElement">
                <div class ="subTopElement">High score</div>
                <div id="highScore"  class ="subTopElement"></div>
            </div>
        </div>
        <div id="content">
            <table class="grid-table">
              <tbody>

              </tbody>
            </table>
        </div>
        <div id="botBand">
            <div id = "add" class ="botElement ">
                <button id ="addBtn" status="0">
                    <img src="../Ressources/add.png" alt="add button" />
                </button>
                <div id ="life" class ="botTag"></div>
            </div>
            <div id ="help" class="botElement ">
                <button id="help">
                    <img src="../Ressources/help.png" alt="help button" />
                </button>

            </div>
        </div>
        <div id="topTrans"></div>
        <div id="botTrans"></div>
    </body>
</html>
