<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">

        <title>Number match</title>
        <link rel="stylesheet" href="styles.css">
        
        <script src="../Scripts/element.js" defer></script>
        <script src="../Scripts/game.js" defer></script>
        <script src="../Scripts/script.js" defer></script>
        <script src="../Scripts/solver.js" defer></script>
        <script src="../Scripts/grid.js" defer></script>
        <script src="../Scripts/input.js" defer></script>
        <script src="../Scripts/check.js" defer></script>
        <script src="../Scripts/customization.js" defer></script>
        <script src="../Scripts/links.js" defer></script>
        <script src="../Scripts/data.js" defer></script>
    </head>
    <body>
        <div id="menu">
            <div class="menu_line">
                <button id="apply">Appliquer</button>
                <button id="restore">Reset</button>
            </div>

            
            <div class="menu_line">
                <p>Fond</p>
                <input type="color" class="colorPicker" id="bck">
            </div>

            <div class="menu_line">
                <p>Score</p>
                <input type="color" class="colorPicker" id="scor">
            </div>

            <div class="menu_line">
                <p>Infos</p>
                <input type="color" class="colorPicker" id="subtxt">
            </div>

            <div class="menu_line">
                <p>Boutons</p>
                <input type="color" class="colorPicker" id="btn">
            </div>

            <div class="menu_line">
                <p>Bord</p>
                <input type="color" class="colorPicker" id="brd">
            </div>

            <div class="menu_line">
                <p>Damier A</p>
                <input type="color" class="colorPicker" id="bckpair">
            </div>

            
            <div class="menu_line">
                <p>Damier B</p>
                <input type="color" class="colorPicker" id="bckimpair">
            </div>
            
            <div class="menu_line">
                <p>Selection</p>
                <input type="color" class="colorPicker" id="sel">
            </div>

            <div class="menu_line">
                <p>Indice</p>
                <input type="color" class="colorPicker" id="clu">
            </div>

            <div class="menu_line">
                <p>Erreur</p>
                <input type="color" class="colorPicker" id="fail">
            </div>

            <div class="menu_line">
                <p>Nombre valide</p>
                <input type="color" class="colorPicker" id="valNum">
            </div>
            
            <div class="menu_line">
                <p>Nombre mort</p>
                <input type="color" class="colorPicker" id="deadNum">
            </div>
            
            <div class="menu_line">
                <p>Nombre selection</p>
                <input type="color" class="colorPicker" id="selNum">
            </div>
            
            <div class="menu_line">
                <p>Nombre indice</p>
                <input type="color" class="colorPicker" id="cluNum">
            </div>
            
            <div class="menu_line">
                <p>Nombre erreur</p>
                <input type="color" class="colorPicker" id="failNum">
            </div>
        </div>
        
        <div id="sideBand">
            <div class="section">
                <div id = "back" class =" imgContain">
                    <img src="../Ressources/back.png" alt="back button" />
                </div>
                <div id ="opt" class =" imgContain">
                    <img src="../Ressources/opt.png" alt="option button" />
                </div>
            </div>
            <div id ="score" class="section"></div>
            
            <div id = "stepSection" class ="section headed">
                <div class ="subElement">Step</div>
                <div id="step" class ="subElement"></div>
            </div>
            <div id ="highSection" class ="section headed">
                <div class ="subElement">High score</div>
                <div id="highScore"  class ="subElement"></div>
            </div>

            <div class="section">
                <div id = "add" class ="botElement ">
                    <button id ="addBtn" status="0">
                        <img src="../Ressources/add.png" alt="add button" />
                    </button>
                    <div id ="life" class ="botTag"></div>
                </div>
                <div id ="help" class="botElement ">
                    <button id="help">
                        <img src="../Ressources/help.png" alt="help button" />
                    </button>

                </div>
            </div>
        </div>
        <div id="content">
            <table class="grid-table">
              <tbody>

              </tbody>
            </table>
        </div>
    </body>
</html>
